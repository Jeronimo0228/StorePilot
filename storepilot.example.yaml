# StorePilot project profile — copy to storepilot.yaml in your app repo root.
# Golden path: docs/DEMO.md
# Multi-app MCP: docs/MULTI_PROJECT.md (register many YAMLs; select by project name)

project: my-app
name: My App

stores:
  ios:
    appId: "1234567890"
    bundleId: com.example.myapp
  android:
    package: com.example.myapp

build:
  provider: eas
  projectId: your-eas-project-uuid

release:
  defaultRollout: 0.1   # 10% staged rollout (fraction 0–1 or percent 1–100)
  tracks:
    internal: internal
    closed: alpha
    open: beta
    production: production

locales:
  - en-US
  - es-CO
